name: Packages CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/tests/**'
      - '.changeset/**'
      - '.github/workflows/packages-ci.yml'
      - '.github/workflows/publish-packages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/tests/**'
      - '.changeset/**'
      - '.github/workflows/packages-ci.yml'
      - '.github/workflows/publish-packages.yml'

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # pnpm must be installed BEFORE setup-node. setup-node@v5 defaults
      # package-manager-cache to true and reads packageManager from
      # package.json, so it shells out to pnpm for the cache path and dies with
      # "Unable to locate executable file: pnpm" when pnpm is not yet on PATH.
      # This job had the two steps in the opposite order and failed at setup on
      # every run. test.yml already orders them correctly.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core package
        run: pnpm --filter @arcanea/core build

      - name: Build MCP server
        run: pnpm --filter @arcanea/mcp-server build

      - name: Build auth and overlay packages
        run: |
          pnpm --filter @arcanea/auth build
          pnpm --filter "@arcanea/overlay-*" build

      - name: Build CLI
        run: pnpm --filter @arcanea/cli build

      - name: Run unit tests
        run: node --test packages/core/tests/*.test.mjs packages/overlay-claude/tests/*.test.mjs

      - name: Run CLI integration tests
        run: node --test packages/cli/tests/*.test.mjs

      - name: Test release lockfile recovery
        run: pnpm test:release

      - name: Verify generated release metadata
        id: release-metadata
        if: matrix.node-version == 20
        run: |
          # Exercise the shared release command; preserve the exact lock change for review.
          mkdir -p "$RUNNER_TEMP/arcanea-release-metadata"
          git rev-parse HEAD > "$RUNNER_TEMP/arcanea-release-metadata/checked-out-commit.txt"
          cp pnpm-lock.yaml "$RUNNER_TEMP/arcanea-release-metadata/before-pnpm-lock.yaml"
          pnpm version-packages
          # Validate independently of the shared script; diff --check only checks whitespace.
          pnpm install --lockfile-only --frozen-lockfile --ignore-scripts
          cp pnpm-lock.yaml "$RUNNER_TEMP/arcanea-release-metadata/after-pnpm-lock.yaml"
          git diff -- pnpm-lock.yaml > "$RUNNER_TEMP/arcanea-release-metadata/pnpm-lock.diff"
          git diff --check

      - name: Upload generated release lockfile evidence
        if: always() && matrix.node-version == 20 && steps.release-metadata.outcome != 'skipped'
        uses: actions/upload-artifact@v5
        with:
          name: release-lockfile-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/arcanea-release-metadata/
          if-no-files-found: error
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check for secrets in source
        run: |
          # Scan for hardcoded secrets/keys in packages
          if grep -rn --include='*.ts' --include='*.js' -E '(sk-[a-zA-Z0-9]{20,}|AIza[a-zA-Z0-9_-]{35}|ghp_[a-zA-Z0-9]{36})' packages/; then
            echo "::error::Potential hardcoded secrets found in packages/"
            exit 1
          fi

      - name: Check for unsafe path operations
        run: |
          # Verify path sanitization is in place for user input
          if grep -rn --include='*.ts' 'writeFileSync\|mkdirSync' packages/cli/src/commands/ | grep -v 'safeSlug\|slug\|sanitize'; then
            echo "::warning::File write operations found - verify path sanitization"
          fi
