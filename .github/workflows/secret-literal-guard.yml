name: Secret literal guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-literal-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate scanner fixtures
        shell: bash
        run: |
          set -euo pipefail
          google_pattern='AIza[A-Za-z0-9_-]{30,}'
          mongo_pattern='mongodb(\+srv)?://[^[:space:]/:]+:[^[:space:]@]+@'
          google_fixture="$(printf 'AI%s' 'za')$(printf 'A%.0s' {1..30})"

          printf '%s\n' "$google_fixture" | grep -Eq "$google_pattern"
          printf '%s\n' 'mongodb://user:password@example.invalid/db' | grep -Eq "$mongo_pattern"
          printf '%s\n' 'mongodb+srv://user:password@example.invalid/db' | grep -Eq "$mongo_pattern"

          if printf '%s\n' 'mongodb+srv://example.invalid/db' | grep -Eq "$mongo_pattern"; then
            echo 'MongoDB scanner fixture matched a URI without credentials.'
            exit 1
          fi

      - name: Reject credential-shaped literals
        shell: bash
        run: |
          set -euo pipefail

          scan_repository() {
            local label="$1"
            local pattern="$2"
            local matches
            local status

            set +e
            matches="$(git grep -lE "$pattern" -- .)"
            status=$?
            set -e

            case "$status" in
              0)
                echo "$label detected in tracked files:"
                printf '%s\n' "$matches"
                return 1
                ;;
              1)
                return 0
                ;;
              *)
                echo "$label scan failed with git grep status $status."
                return "$status"
                ;;
            esac
          }

          scan_repository 'Google API key-shaped literal' 'AIza[A-Za-z0-9_-]{30,}'
          scan_repository 'Credential-bearing MongoDB URI' 'mongodb(\+srv)?://[^[:space:]/:]+:[^[:space:]@]+@'
