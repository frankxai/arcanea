name: Secret literal guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-literal-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential-shaped literals
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'AIza[A-Za-z0-9_-]{30,}' -- ':!*.lock'; then
            echo 'Google API key-shaped literal detected.'
            exit 1
          fi
          if git grep -nE 'mongodb(\\+srv)?://[^[:space:]/:]+:[^[:space:]@]+@'; then
            echo 'Credential-bearing MongoDB URI detected.'
            exit 1
          fi
