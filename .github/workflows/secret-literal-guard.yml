name: Secret literal guard

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: secret-literal-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-literal-guard:
    # Deliberately NOT draft-gated. A leaked literal must fail the very first
    # push of a draft, before anyone iterates on top of it.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate scanner fixtures
        shell: bash
        run: |
          set -euo pipefail
          google_pattern='AIza[A-Za-z0-9_-]{30,}'
          mongo_pattern='mongodb(\+srv)?://[^[:space:]/:]+:[^[:space:]@]+@'
          google_fixture="$(printf 'AI%s' 'za')$(printf 'A%.0s' {1..30})"
          authority='user:password@example.invalid'

          printf '%s\n' "$google_fixture" | grep -Eq "$google_pattern"
          printf '%s\n' "mongodb://$authority/db" | grep -Eq "$mongo_pattern"
          printf '%s\n' "mongodb+srv://$authority/db" | grep -Eq "$mongo_pattern"

          if printf '%s\n' 'mongodb+srv://example.invalid/db' | grep -Eq "$mongo_pattern"; then
            echo 'MongoDB scanner fixture matched a URI without credentials.'
            exit 1
          fi

      - name: Reject credential-shaped literals
        shell: bash
        run: |
          set -euo pipefail

          scan_repository() {
            local label="$1"
            local pattern="$2"
            local matches
            local status

            set +e
            matches="$(git grep -lE "$pattern" -- .)"
            status=$?
            set -e

            case "$status" in
              0)
                echo "$label detected in tracked files:"
                printf '%s\n' "$matches"
                return 1
                ;;
              1)
                return 0
                ;;
              *)
                echo "$label scan failed with git grep status $status."
                return "$status"
                ;;
            esac
          }

          scan_repository 'Google API key-shaped literal' 'AIza[A-Za-z0-9_-]{30,}'
          scan_repository 'Credential-bearing MongoDB URI' 'mongodb(\+srv)?://[^[:space:]/:]+:[^[:space:]@]+@'

      - name: Verify Gemini consumer fails closed without a key
        shell: bash
        run: |
          set -euo pipefail

          set +e
          output="$(env -u GEMINI_API_KEY timeout 5s node scripts/generate-with-nano-banana.js 2>&1)"
          status=$?
          set -e

          if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then
            echo 'Gemini consumer did not fail promptly without a key.'
            exit 1
          fi

          if [ "$output" != 'GEMINI_API_KEY is required' ]; then
            echo 'Gemini consumer emitted an unexpected missing-key diagnostic.'
            exit 1
          fi
