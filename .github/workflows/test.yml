name: Arcanea Test Suite

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Full Package Tests (109 tests)
  cli-tests:
    name: CLI Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build every workspace package, not a hand-listed subset. The previous
      # list named 11 targets and had drifted behind the test suite: the tests
      # import from dist/, so an unlisted package failed on a missing module
      # and cancelled the rest of its file. swarm-coordinator alone accounted
      # for 135 failures, and 1,800+ tests never ran at all while the job
      # reported a plain red X. A recursive build cannot drift.
      - name: Build packages
        run: |
          pnpm -r run build
          pnpm --filter arcanea-code exec -- esbuild src/guardians.ts --outfile=tests/_guardians.mjs --format=esm --platform=node

      # dot reporter, not the default TAP. TAP emits ~1.8M characters for this
      # suite and has no failure recap, so a red X is unreadable without
      # downloading the whole log to find three "not ok" lines scattered
      # through it. dot prints one character per test and a "Failed tests:"
      # block at the end with names, assertions and source locations.
      - name: Run all tests
        run: node --test --test-reporter=dot packages/*/tests/*.test.mjs
        env:
          CI: true
          NO_COLOR: '1'

  # TypeScript Type Check
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check all packages
        run: |
          pnpm --filter @arcanea/core run build
          pnpm --filter @arcanea/os run build
          pnpm --filter @arcanea/auth run build
          pnpm --filter @arcanea/extension-core run build
          pnpm --filter "@arcanea/overlay-*" run build
          pnpm --filter @arcanea/mcp-server run build
          pnpm --filter @arcanea/cli run build
          pnpm --filter arcanea-intelligence-os run build
          pnpm --filter "@starlight/runtime" run build

  # Security Audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit --audit-level=high || true

  # Test Summary
  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [cli-tests, typecheck]
    if: always()

    steps:
      - name: Results
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| CLI Tests | ${{ needs.cli-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript | ${{ needs.typecheck.result }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.cli-tests.result }}" != "success" ] || [ "${{ needs.typecheck.result }}" != "success" ]; then
            exit 1
          fi
