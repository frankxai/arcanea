name: Arcanea Test Suite

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Full Package Tests (109 tests)
  cli-tests:
    name: CLI Tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build every package under packages/, not a hand-listed subset. The
      # previous list named 11 targets and had drifted behind the test suite:
      # the tests import from dist/, so an unlisted package failed on a missing
      # module and cancelled the rest of its file. swarm-coordinator alone
      # accounted for 135 failures, and 1,800+ tests never ran at all while the
      # job reported a plain red X. A glob cannot drift the way a list does.
      #
      # Scoped to ./packages/** rather than a bare `pnpm -r`. The workspace also
      # covers apps/* and tools/*, and a bare recursive build pulls in
      # apps/web's `next build` — which this job has no reason to run, since
      # nothing under packages/*/tests imports from apps/ or tools/ (verified).
      # The pull_request trigger carries no paths filter, so that would have put
      # a Next.js build on every PR in the repo, twice over the Node matrix,
      # adding wall-clock and a failure surface unrelated to this job's purpose.
      # Verified sufficient the hard way: every dist/ in the repo deleted, only
      # ./packages/** rebuilt, full suite still 3,300 pass / 0 fail.
      - name: Build packages
        run: |
          pnpm --filter "./packages/**" run build
          pnpm --filter arcanea-code exec -- esbuild src/guardians.ts --outfile=tests/_guardians.mjs --format=esm --platform=node

      # dot reporter, not the default TAP. TAP emits ~1.8M characters for this
      # suite and has no failure recap, so a red X is unreadable without
      # downloading the whole log to find three "not ok" lines scattered
      # through it. dot prints one character per test and a "Failed tests:"
      # block at the end with names, assertions and source locations.
      - name: Run all tests
        run: node --test --test-reporter=dot packages/*/tests/*.test.mjs
        env:
          CI: true
          NO_COLOR: '1'

  # TypeScript Type Check
  typecheck:
    name: TypeScript
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check all packages
        run: |
          pnpm --filter @arcanea/core run build
          pnpm --filter @arcanea/os run build
          pnpm --filter @arcanea/auth run build
          pnpm --filter @arcanea/extension-core run build
          pnpm --filter "@arcanea/overlay-*" run build
          pnpm --filter @arcanea/mcp-server run build
          pnpm --filter @arcanea/cli run build
          pnpm --filter arcanea-intelligence-os run build
          pnpm --filter "@starlight/runtime" run build

  # Security Audit
  security:
    name: Security Audit
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit --audit-level=high || true

  # Test Summary
  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [cli-tests, typecheck]
    # Not always(). This workflow sets cancel-in-progress, so pushing twice in
    # quick succession cancels the earlier run — and with always() the summary
    # still ran, saw a non-success result, and reported the PR red. A superseded
    # run has no verdict to give; !cancelled() lets it stay quiet.
    if: ${{ !cancelled() }}

    steps:
      - name: Results
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| CLI Tests | ${{ needs.cli-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript | ${{ needs.typecheck.result }} |" >> $GITHUB_STEP_SUMMARY

          # Fail on failure, not on "anything that isn't success". The previous
          # form also failed on cancelled and skipped, which conflates "a test
          # broke" with "this run never finished" — the same conflation the rest
          # of this branch is about. A matrix leg cancelled by fail-fast still
          # surfaces, because the parent job's result is failure in that case.
          if [ "${{ needs.cli-tests.result }}" = "failure" ] || [ "${{ needs.typecheck.result }}" = "failure" ]; then
            exit 1
          fi
