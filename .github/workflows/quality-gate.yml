name: Quality Gate

# Runs on every push and PR - fast feedback loop
on:
  push:
    branches: [main, develop, 'feature/**', 'cursor/**']
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8.15.0'

jobs:
  quality:
    name: TypeScript & Package Tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript Check
        run: pnpm turbo run type-check --filter=@arcanea/web

      - name: ESLint Debt Report
        run: pnpm turbo run lint --filter=@arcanea/web
        continue-on-error: true

      - name: Package Smoke Tests
        run: pnpm test:quick

  release-integrity:
    name: No Split-Brain Publish
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check for forbidden per-package publish workflows
        run: |
          FOUND=$(find . -path "./.github/workflows/*" -prune -o -name "publish.yml" -path "*/.github/workflows/publish.yml" -print)
          if [ -n "$FOUND" ]; then
            echo "::error::Per-package publish.yml found — monorepo uses Changesets only."
            echo "Forbidden files:"
            echo "$FOUND"
            echo ""
            echo "Delete these and use 'pnpm changeset' instead."
            exit 1
          fi
          echo "Release integrity check passed — no split-brain publish workflows."

  build:
    name: Production Build
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build --filter=@arcanea/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}

      - name: Build Summary
        if: success()
        run: |
          echo "## Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "- Package manager: pnpm" >> $GITHUB_STEP_SUMMARY
          echo "- TypeScript: strict production build" >> $GITHUB_STEP_SUMMARY
          echo "- Build: production ready" >> $GITHUB_STEP_SUMMARY

  status:
    name: Quality Status
    runs-on: ubuntu-latest
    needs: [quality, build, release-integrity]
    timeout-minutes: 5
    # Not always(): a run cancelled by cancel-in-progress has no verdict to
    # report, and reporting one anyway painted the PR red for being pushed to
    # twice. Same fix as test.yml's summary job.
    if: ${{ !cancelled() }}

    steps:
      - name: Check Results
        run: |
          echo "TypeScript/Tests: ${{ needs.quality.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Release integrity: ${{ needs.release-integrity.result }}"

          # Fail on failure, not on "anything that isn't success". The previous
          # form treated cancelled and skipped as failures too, so a superseded
          # run reported "Quality checks failed" with every underlying job
          # either passing or never having finished.
          if [ "${{ needs.quality.result }}" == "failure" ] || [ "${{ needs.build.result }}" == "failure" ] || [ "${{ needs.release-integrity.result }}" == "failure" ]; then
            echo "Quality checks failed"
            exit 1
          fi

          echo "All quality checks passed!"
