name: Lore canon

# The `lore-release-gate` skill covers a working session. This covers everything
# else: every PR that touches lore, whoever or whatever opened it.
#
# Runs the mechanical subset of canon consistency — no model, no network, ~1
# second. The judgment half stays in the `lore-release-gate` and
# `canon-evaluation` skills, which a session runs against the same files.
#
# Why it exists: two locked godbeast renames silently failed to propagate across
# ~15 files over five months, including an active chapter of a published Library
# text. Nobody introduced that in one bad commit — it accumulated because
# nothing checked. Issue #98.

# Filter broadly: a godbeast name hardcoded in a TypeScript constant is exactly
# as wrong as one in a markdown table, and lore lives in .md, .ts, .json and
# .yaml across this repo. The linter's own isLoreFile() decides what actually
# counts and short-circuits cheaply when nothing is in scope.
on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.yaml'
      - '**/*.yml'
      - '**/*.json'
      - '**/*.ts'
      - '**/*.tsx'
      - '.github/workflows/lore-canon.yml'
      - '.claude/ci/lore-lint.mjs'

permissions:
  contents: read

jobs:
  canon:
    name: Canon consistency (mechanical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test the linter
        # The linter is only worth having if it stays trusted, and that rests on
        # near-zero false positives. These fixtures lock that in — a multi-pair
        # table row, the full ten-gate table, prose naming a retired entity, a
        # Gate name used as an ordinary English word — alongside the drift it
        # must still catch. Verified by hand once is verified until the next edit.
        run: node --test .claude/ci/lore-lint.test.mjs

      - name: Smoke-test against the vault
        # Prove the script still parses and that its canon table still matches
        # the vault. A linter whose constants have drifted from
        # CANON_LOCKED.md is worse than no linter — it certifies the drift.
        run: |
          node --check .claude/ci/lore-lint.mjs && echo "ok lint script parses"
          node .claude/ci/lore-lint.mjs .arcanea/lore/CANON_LOCKED.md

      - name: Check changed lore files
        # checkout above used fetch-depth: 0, so the base ref is already local.
        # --changed is a ratchet: only lines this PR adds. The repo has real
        # pre-existing drift (#98) and failing a PR for a line it merely sat
        # next to is how a linter gets switched off.
        run: node .claude/ci/lore-lint.mjs --changed --base "origin/${{ github.base_ref }}"
