schema_version: "1.0"
registry_id: "ARC-MYSTERIES"
effective_date: "2026-08-27"

rules:
  - "Every marketed question is either promised_answer or permanent_mystery."
  - "A promised answer has a reveal window and an accountable owner."
  - "A permanent mystery may gain evidence but may not receive a definitive answer."
  - "Marketing may tease only what the release plan can pay off."

